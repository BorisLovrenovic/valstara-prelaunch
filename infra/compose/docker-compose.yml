name: valstara-prelaunch

services:
  postgres:
    build:
      context: ../backups
      dockerfile: postgres-pgbackrest.Dockerfile
    image: valstara-postgres-pgbackrest:local
    restart: unless-stopped
    environment:
      POSTGRES_DB: valstara_waitlist
      POSTGRES_USER: ${VALSTARA_DB_USER:-valstara}
      POSTGRES_PASSWORD: ${VALSTARA_DB_PASSWORD:-valstara-local-only}
      UMAMI_DB_NAME: umami
      UMAMI_DB_USER: ${UMAMI_DB_USER:-umami}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-umami-local-only}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:-pgbackrest-local-only}
      PGBACKREST_PG1_USER: ${VALSTARA_DB_USER:-valstara}
    command:
      [
        'postgres',
        '-c',
        'archive_mode=on',
        '-c',
        'archive_command=pgbackrest --stanza=valstara archive-push %p',
        '-c',
        'wal_level=replica',
      ]
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - pgbackrest-repository:/var/lib/pgbackrest
      - ./init-umami-db.sh:/docker-entrypoint-initdb.d/init-umami-db.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && pg_isready -U "$$UMAMI_DB_USER" -d "$$UMAMI_DB_NAME"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-512m}

  app:
    image: node:22.22.3-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace
    command: ['sh', '/workspace/infra/compose/run-app.sh']
    environment:
      ADMIN_CREDENTIAL: ${ADMIN_CREDENTIAL:?ADMIN_CREDENTIAL is required}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?ADMIN_TOTP_SECRET is required}
      DATABASE_URL: postgresql://valstara_app:${VALSTARA_APP_DB_PASSWORD:-valstara-app-local-only}@postgres:5432/valstara_waitlist
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      IP_PREFIX_PEPPER: ${IP_PREFIX_PEPPER:?IP_PREFIX_PEPPER is required}
      REFERRAL_SIGNING_SECRET: ${REFERRAL_SIGNING_SECRET:?REFERRAL_SIGNING_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_TEST_RECIPIENT: ${RESEND_TEST_RECIPIENT:?RESEND_TEST_RECIPIENT is required}
      VERIFICATION_RATE_BASELINE_DAYS: ${VERIFICATION_RATE_BASELINE_DAYS:-7}
      VERIFICATION_RATE_COHORT_HOURS: ${VERIFICATION_RATE_COHORT_HOURS:-24}
      VERIFICATION_RATE_COLLAPSE_PERCENT: ${VERIFICATION_RATE_COLLAPSE_PERCENT:-50}
      VERIFICATION_RATE_MINIMUM_SIGNUPS: ${VERIFICATION_RATE_MINIMUM_SIGNUPS:-50}
      ASTRO_TELEMETRY_DISABLED: '1'
      NODE_ENV: development
      WAITLIST_LIVE_AT: ${WAITLIST_LIVE_AT:-}
      DRAND_CHAIN_HASH: ${DRAND_CHAIN_HASH:-}
      DRAND_CHAIN_PUBLIC_KEY: ${DRAND_CHAIN_PUBLIC_KEY:-}
      DRAND_RELAY_URLS: ${DRAND_RELAY_URLS:-}
      P1_ALERT_WEBHOOK_TOKEN: ${P1_ALERT_WEBHOOK_TOKEN:-local-only-alert-token}
      P1_ALERT_WEBHOOK_URL: ${P1_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/local-only-alert-sink}
      # Same install as migrate — pin npm the same way (see the migrate service).
      NPM_CONFIG_MAXSOCKETS: '4'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    ports:
      - '127.0.0.1:4321:4321'
    volumes:
      - ../..:/workspace
      - app-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '/workspace/infra/compose/app-healthcheck.mjs']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s
    mem_limit: ${APP_MEM_LIMIT:-768m}
    memswap_limit: ${APP_MEM_LIMIT:-768m}

  migrate:
    image: node:22.22.3-bookworm-slim
    restart: 'no'
    working_dir: /workspace
    command: ['sh', '/workspace/infra/compose/run-migrations.sh']
    environment:
      MIGRATION_DATABASE_URL: postgresql://${VALSTARA_DB_USER:-valstara}:${VALSTARA_DB_PASSWORD:-valstara-local-only}@postgres:5432/valstara_waitlist
      VALSTARA_APP_DB_PASSWORD: ${VALSTARA_APP_DB_PASSWORD:-valstara-app-local-only}
      # npm's install concurrency follows the host CPU count, so peak memory
      # differs between a laptop and a CI runner. Pin it so the ceiling below
      # means the same thing everywhere.
      NPM_CONFIG_MAXSOCKETS: '4'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    volumes:
      - ../..:/workspace
      - app-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${MIGRATION_MEM_LIMIT:-768m}
    memswap_limit: ${MIGRATION_MEM_LIMIT:-768m}

  maintenance:
    image: node:22.22.3-bookworm-slim
    restart: unless-stopped
    working_dir: /workspace
    command: ['node', '/workspace/src/server/subscriber/run-maintenance.ts']
    environment:
      DATABASE_URL: postgresql://valstara_app:${VALSTARA_APP_DB_PASSWORD:-valstara-app-local-only}@postgres:5432/valstara_waitlist
      NODE_ENV: development
      WAITLIST_LIVE_AT: ${WAITLIST_LIVE_AT:-}
      DRAND_CHAIN_HASH: ${DRAND_CHAIN_HASH:-}
      DRAND_CHAIN_PUBLIC_KEY: ${DRAND_CHAIN_PUBLIC_KEY:-}
      DRAND_RELAY_URLS: ${DRAND_RELAY_URLS:-}
      P1_ALERT_WEBHOOK_TOKEN: ${P1_ALERT_WEBHOOK_TOKEN:-local-only-alert-token}
      P1_ALERT_WEBHOOK_URL: ${P1_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/local-only-alert-sink}
      VERIFICATION_RATE_BASELINE_DAYS: ${VERIFICATION_RATE_BASELINE_DAYS:-7}
      VERIFICATION_RATE_COHORT_HOURS: ${VERIFICATION_RATE_COHORT_HOURS:-24}
      VERIFICATION_RATE_COLLAPSE_PERCENT: ${VERIFICATION_RATE_COLLAPSE_PERCENT:-50}
      VERIFICATION_RATE_MINIMUM_SIGNUPS: ${VERIFICATION_RATE_MINIMUM_SIGNUPS:-50}
    volumes:
      - ../..:/workspace
      - app-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: ${MAINTENANCE_MEM_LIMIT:-128m}
    memswap_limit: ${MAINTENANCE_MEM_LIMIT:-128m}

  umami:
    image: ghcr.io/umami-software/umami:3.3.0
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami-local-only}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-umami-local-app-secret-change-outside-local-development}
      DISABLE_TELEMETRY: '1'
      PRIVATE_MODE: '1'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${UMAMI_MEM_LIMIT:-768m}
    memswap_limit: ${UMAMI_MEM_LIMIT:-768m}

volumes:
  app-node-modules:
  postgres-data:
  pgbackrest-repository:
