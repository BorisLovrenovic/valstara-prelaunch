name: valstara-prelaunch-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: valstara_waitlist
      POSTGRES_USER: ${VALSTARA_DB_USER:?VALSTARA_DB_USER is required}
      POSTGRES_PASSWORD: ${VALSTARA_DB_PASSWORD:?VALSTARA_DB_PASSWORD is required}
      UMAMI_DB_NAME: umami
      UMAMI_DB_USER: ${UMAMI_DB_USER:?UMAMI_DB_USER is required}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is required}
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
      - ./init-umami-db.sh:/docker-entrypoint-initdb.d/init-umami-db.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && pg_isready -U "$$UMAMI_DB_USER" -d "$$UMAMI_DB_NAME"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-512m}
    networks:
      - backend

  migrate:
    image: ${VALSTARA_IMAGE:?VALSTARA_IMAGE must be a SHA-tagged GHCR image}
    restart: 'no'
    command:
      [
        'node',
        './src/server/db/run-migrations.ts',
        '${VALSTARA_RELEASE:?VALSTARA_RELEASE is required}',
      ]
    environment:
      MIGRATION_DATABASE_URL: postgresql://${VALSTARA_DB_USER:?VALSTARA_DB_USER is required}:${VALSTARA_DB_PASSWORD:?VALSTARA_DB_PASSWORD is required}@postgres:5432/valstara_waitlist
      VALSTARA_APP_DB_PASSWORD: ${VALSTARA_APP_DB_PASSWORD:?VALSTARA_APP_DB_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${MIGRATION_MEM_LIMIT:-768m}
    memswap_limit: ${MIGRATION_MEM_LIMIT:-768m}
    networks:
      - backend

  app:
    image: ${VALSTARA_IMAGE:?VALSTARA_IMAGE must be a SHA-tagged GHCR image}
    restart: unless-stopped
    environment:
      ADMIN_CREDENTIAL: ${ADMIN_CREDENTIAL:?ADMIN_CREDENTIAL is required}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?ADMIN_TOTP_SECRET is required}
      DATABASE_URL: postgresql://valstara_app:${VALSTARA_APP_DB_PASSWORD:?VALSTARA_APP_DB_PASSWORD is required}@postgres:5432/valstara_waitlist
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      IP_PREFIX_PEPPER: ${IP_PREFIX_PEPPER:?IP_PREFIX_PEPPER is required}
      REFERRAL_SIGNING_SECRET: ${REFERRAL_SIGNING_SECRET:?REFERRAL_SIGNING_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_TEST_RECIPIENT: ${RESEND_TEST_RECIPIENT:?RESEND_TEST_RECIPIENT is required}
      VERIFICATION_RATE_BASELINE_DAYS: ${VERIFICATION_RATE_BASELINE_DAYS:-7}
      VERIFICATION_RATE_COHORT_HOURS: ${VERIFICATION_RATE_COHORT_HOURS:-24}
      VERIFICATION_RATE_COLLAPSE_PERCENT: ${VERIFICATION_RATE_COLLAPSE_PERCENT:-50}
      VERIFICATION_RATE_MINIMUM_SIGNUPS: ${VERIFICATION_RATE_MINIMUM_SIGNUPS:-50}
      ASTRO_TELEMETRY_DISABLED: '1'
      HOST: '0.0.0.0'
      NODE_ENV: production
      WAITLIST_LIVE_AT: ${WAITLIST_LIVE_AT:-}
      PORT: '4321'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: ${APP_MEM_LIMIT:-768m}
    memswap_limit: ${APP_MEM_LIMIT:-768m}
    networks:
      - backend

  maintenance:
    image: ${VALSTARA_IMAGE:?VALSTARA_IMAGE must be a SHA-tagged GHCR image}
    restart: unless-stopped
    command: ['node', './src/server/subscriber/run-maintenance.ts']
    environment:
      DATABASE_URL: postgresql://valstara_app:${VALSTARA_APP_DB_PASSWORD:?VALSTARA_APP_DB_PASSWORD is required}@postgres:5432/valstara_waitlist
      NODE_ENV: production
      WAITLIST_LIVE_AT: ${WAITLIST_LIVE_AT:-}
      P1_ALERT_WEBHOOK_TOKEN: ${P1_ALERT_WEBHOOK_TOKEN:?P1_ALERT_WEBHOOK_TOKEN is required}
      P1_ALERT_WEBHOOK_URL: ${P1_ALERT_WEBHOOK_URL:?P1_ALERT_WEBHOOK_URL is required}
      VERIFICATION_RATE_BASELINE_DAYS: ${VERIFICATION_RATE_BASELINE_DAYS:-7}
      VERIFICATION_RATE_COHORT_HOURS: ${VERIFICATION_RATE_COHORT_HOURS:-24}
      VERIFICATION_RATE_COLLAPSE_PERCENT: ${VERIFICATION_RATE_COLLAPSE_PERCENT:-50}
      VERIFICATION_RATE_MINIMUM_SIGNUPS: ${VERIFICATION_RATE_MINIMUM_SIGNUPS:-50}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.kill(1, 0)']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: ${MAINTENANCE_MEM_LIMIT:-128m}
    memswap_limit: ${MAINTENANCE_MEM_LIMIT:-128m}
    networks:
      - backend

  umami:
    image: ghcr.io/umami-software/umami:3.3.0
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:?UMAMI_DB_USER is required}:${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD is required}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
      DISABLE_TELEMETRY: '1'
      PRIVATE_MODE: '1'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${UMAMI_MEM_LIMIT:-768m}
    memswap_limit: ${UMAMI_MEM_LIMIT:-768m}
    networks:
      - backend

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:-valstara.com}
    ports:
      - '${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    secrets:
      - caddy_origin_cert
      - caddy_origin_key
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:2019/config/',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    memswap_limit: ${CADDY_MEM_LIMIT:-128m}
    networks:
      - edge
      - backend

networks:
  edge:
  backend:
    internal: true

secrets:
  caddy_origin_cert:
    file: ${CADDY_ORIGIN_CERT_PATH:?CADDY_ORIGIN_CERT_PATH is required}
  caddy_origin_key:
    file: ${CADDY_ORIGIN_KEY_PATH:?CADDY_ORIGIN_KEY_PATH is required}

volumes:
  caddy-config:
  caddy-data:
  postgres-production-data:
