# CI overlay. Use with the base file:
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.ci.yml up -d --wait
#
# On a CI runner the workspace is already installed by `npm ci` before the stack
# starts. The base file mounts a named volume over /workspace/node_modules to
# keep container modules separate from a developer's host modules — necessary
# locally, pointless here, and the cause of a second install inside a
# memory-capped container (see infra/ENV.md).
#
# This overlay replaces that named volume with a bind to the runner's own
# node_modules. Both sides are glibc — the runner is ubuntu-latest and the
# containers are bookworm-slim — so the platform-specific binaries in the
# lockfile (@astrojs/compiler-binding-linux-x64-gnu, @rolldown/binding-*-gnu,
# @esbuild/linux-x64, sharp) load correctly. This is why the base images are
# not Alpine: musl and glibc builds are not interchangeable.
services:
  app:
    # CI runs the built server, not `astro dev`. The dev server optimises Vite
    # dependencies on first boot and restarts itself once when it does, which
    # races `up --wait` and fails it intermittently. The build is also closer to
    # what production runs, and there is nothing in CI to hot-reload.
    # The runner builds before starting the stack, so ./dist is already present
    # on the bind mount.
    command:
      [
        'sh',
        '-c',
        'node ./src/server/config.ts && exec node ./dist/server/entry.mjs',
      ]
    environment:
      HOST: '0.0.0.0'
      PORT: '4321'
    volumes:
      - ../..:/workspace
      - ../../node_modules:/workspace/node_modules

  migrate:
    volumes:
      - ../..:/workspace
      - ../../node_modules:/workspace/node_modules
