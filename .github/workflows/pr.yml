name: PR checks

on:
  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: valstara
          POSTGRES_PASSWORD: valstara-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valstara -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://valstara:valstara-local-only@127.0.0.1:5432/postgres
      VALSTARA_APP_DB_PASSWORD: valstara-app-local-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose -f infra/compose/docker-compose.yml up -d --wait
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: valstara
          POSTGRES_PASSWORD: valstara-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valstara -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TEST_DATABASE_URL: postgresql://valstara:valstara-local-only@127.0.0.1:5432/postgres
      VALSTARA_APP_DB_PASSWORD: valstara-app-local-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose -f infra/compose/docker-compose.yml up -d --wait
      - run: npm run coverage
