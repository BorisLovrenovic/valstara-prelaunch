<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signup form states · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./valstara.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<dc-import name="StatesDesktop" device="phone" theme="{{theme}}" annotations="{{annotations}}" hint-size="2708px,3200px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"annotations":{"editor":"boolean","default":false},"$preview":{"width":2708,"height":3200}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme || 'light', annotations: !!this.props.annotations };
  }
}
</script>
</body>
</html>
